<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Manager Clash - Update</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0a0a0a;
font-family:Arial,sans-serif;
direction:rtl;
}
.container{
text-align:center;
color:white;
}
.loader{
width:70px;
height:70px;
border:5px solid #222;
border-top:5px solid #ffd700;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 30px auto;
}
@keyframes spin{
100%{transform:rotate(360deg);}
}
.title{
font-size:36px;
color:#ffd700;
font-weight:bold;
margin-bottom:15px;
}
.sub{
font-size:22px;
color:#aaa;
margin-bottom:8px;
}
.version{
font-size:16px;
color:#555;
margin-top:20px;
}
</style>
</head>
<body>
<div class="container">
<div class="loader"></div>
<div class="title">Updating</div>
<div class="sub">درحال آپدیت</div>
<div class="version">لطفاً چند دقیقه بعد مجدداً وارد شوید</div>
</div>
</body>
</html>
